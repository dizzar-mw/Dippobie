<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dippobie Crew | Official Site</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinning { animation: spin-slow 10s linear infinite; }
    </style>
</head>
<body class="bg-zinc-950 text-white font-sans min-h-screen pb-32">

    <!-- Hero Section -->
    <header class="py-12 text-center border-b border-zinc-800">
        <h1 class="text-5xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 uppercase">
            Dippobie Crew
        </h1>
        <p class="text-zinc-400 mt-2 tracking-widest text-sm">THE FUTURE OF THE GHETTO</p>
    </header>

    <!-- Music Tracklist Section -->
    <main class="max-w-4xl mx-auto px-4 mt-10">
        <h2 class="text-2xl font-bold mb-6 text-cyan-400 flex items-center gap-2">
            <i class="fa-solid fa-fire"></i> Latest Drops
        </h2>
        
        <div id="track-list" class="space-y-4">
            <!-- Tracks will be dynamically loaded here, but here is a placeholder -->
            <div class="bg-zinc-900/60 border border-zinc-800 p-4 rounded-2xl flex items-center justify-between backdrop-blur-md hover:border-cyan-500/50 transition-all duration-300">
                <div class="flex items-center gap-4">
                    <!-- Song Icon -->
                    <img id="thumb-1" src="https://placehold.co/150x150/cyan/black?text=Dippobie" alt="Cover" class="w-16 h-16 rounded-full object-cover border-2 border-zinc-700">
                    <div>
                        <h3 class="font-bold text-lg text-white">Ghetto Anthem</h3>
                        <p class="text-zinc-400 text-sm">Dippobie Crew</p>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="flex items-center gap-3">
                    <button onclick="playTrack('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', 'Ghetto Anthem', 'https://placehold.co/150x150/cyan/black?text=Dippobie', 'thumb-1')" class="w-12 h-12 rounded-full bg-cyan-500 hover:bg-cyan-400 text-black flex items-center justify-center font-bold transition-transform active:scale-95">
                        <i class="fa-solid fa-play ml-1"></i>
                    </button>
                    <a href="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" download="Ghetto_Anthem_Dippobie.mp3" class="w-12 h-12 rounded-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 flex items-center justify-center transition-transform active:scale-95">
                        <i class="fa-solid fa-download"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- 🎵 Floating Sticky Music Player -->
    <div id="global-player" class="fixed bottom-6 left-4 right-4 max-w-2xl mx-auto bg-zinc-900/90 border border-zinc-700/50 p-4 rounded-2xl shadow-2xl backdrop-blur-lg flex items-center justify-between hidden transition-all duration-500">
        <div class="flex items-center gap-3">
            <img id="player-img" src="" alt="" class="w-12 h-12 rounded-full object-cover spinning">
            <div>
                <h4 id="player-title" class="font-bold text-sm text-white line-clamp-1">Song Title</h4>
                <p class="text-zinc-400 text-xs">Playing Now</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <audio id="main-audio" src=""></audio>
            <button onclick="togglePlay()" id="player-play-btn" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center font-bold">
                <i class="fa-solid fa-pause"></i>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
