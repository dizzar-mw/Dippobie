<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dippobie Official</title>
    <link rel="stylesheet" href="style.css">
    <!-- Wavesurfer.js for advanced audio waveforms -->
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <header>
        <div class="logo">DIPPOBIE</div>
    </header>

    <main>
        <!-- The visual identity hero section -->
        <section id="hero">
            <h1>BIG DREAMS. LOUD MUSIC.</h1>
            <p>The official home of Dippobie.</p>
        </section>

        <!-- This is where the JavaScript will automatically inject the tracks -->
        <section id="music-container">
            <h2>LATEST RELEASES</h2>
            <div id="tracks-list"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
